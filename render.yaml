# Deploys the battle-report renderer (scripts/battle_report_server.py) to
# Render's free tier. See the plan for the full design; the short version:
#
#   - Free tier spins down after 15 min idle and takes about a minute to wake
#     on the next request -- the mod's export button probes /healthz first and
#     retries with backoff rather than depending on TTS's undocumented
#     WebRequest timeout. See TTSLUA/global.ttslua's "Cold start" section.
#   - No persistent disk on the free tier, so reports live in memory with a
#     TTL (report_store.py) -- LCT_REPORT_STORE_DIR is left unset here.
#   - The service only ever needs data/terrain_cache.json (1.04 MB) and
#     data/plate_outlines.json (7 KB); it never opens data/maps/ (26 MB).
#
# LCT_REPORT_TOKEN is deliberately not set here (sync: false) -- set it once
# in the Render dashboard after the first deploy, then bake the same value
# into the mod via LCT_REPORT_TOKEN at `compile.py` time (see compile.py's
# BATTLE_REPORT_REMOTE_BASE / token section).
services:
  - type: web
    name: lct-report              # short: it appears in every printed URL
    runtime: python
    plan: free
    region: oregon                 # change to whichever Render region is nearest
    branch: feature/battle-report-hosting   # switch to main once this merges
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python scripts/battle_report_server.py --host 0.0.0.0 --port $PORT --mode hosted"
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.5"           # matches .venv/pyvenv.cfg
      - key: LCT_PUBLIC_BASE_URL
        value: https://lct-report.onrender.com
      - key: LCT_REPORT_TOKEN
        sync: false                # set in the dashboard; never committed
      - key: LCT_REPORT_TTL
        value: "900"                # 15 min; shortened automatically under load
                                     # or after a download (see report_store.py)
      - key: LCT_REPORT_MAX
        value: "500"
